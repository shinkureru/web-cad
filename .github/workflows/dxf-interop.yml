name: DXF compatibility smoke test (ezdxf)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/cad/dxf.ts'
      - 'src/cad/dxf.test.ts'
      - 'scripts/validate_dxf.py'
      - '.github/workflows/dxf-interop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-ascii-dxf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript test dependencies
        run: npm install --no-audit --no-fund
      - name: Generate DXF with real blocks, dimensions and Traditional Chinese text
        env:
          DXF_SMOKE_FILE: ${{ runner.temp }}/webcad-interop.dxf
        run: npx vitest run src/cad/dxf.test.ts
      - name: Install independent DXF parser
        run: python -m pip install 'ezdxf>=1.3,<2'
      - name: Audit DXF with ezdxf
        run: python scripts/validate_dxf.py "${{ runner.temp }}/webcad-interop.dxf"
